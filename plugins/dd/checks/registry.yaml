    cmd: '{ echo "== tabelas =="; grep -rhoiE "create table (if not exists )?[\"a-z_.]+" --include="*.sql" . | sort -u; echo "== RLS habilitado =="; grep -rhoiE "alter table [\"a-z_.]+ enable row level security" --include="*.sql" . | sort -u; } 2>/dev/null; true'
