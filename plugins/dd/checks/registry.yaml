- id: DEP-004
  titulo: Dependencia abandonada
  dominio: dependencias
  severidade: media
  cadencia: [release, postura]
  bloqueia: false
  stacks: ["*"]
  deteccao:
    tipo: comando
    cmd: "npm ls --omit=dev --depth=0 --json | jq -r '.dependencies | keys[]' | xargs -I{} npm view {} time.modified"
  guia: checks/dependencias.md#dep-004

- id: DEP-005
