- id: DEP-001
  titulo: Dependencia com CVE critico ou alto com correcao disponivel
  dominio: dependencias
  severidade: critica
  cadencia: [pr, release, postura]
  bloqueia: true
  stacks: ["*"]
  deteccao:
    tipo: comando
    cmd: "npm audit --omit=dev --json | jq -e '[.vulnerabilities[] | select((.severity==\"high\" or .severity==\"critical\") and .fixAvailable != false)] | length > 0'"
  guia: checks/dependencias.md#dep-001

- id: DEP-002
  titulo: Lockfile ausente ou dessincronizado do manifest
  dominio: dependencias
  severidade: alta
  cadencia: [pr, release, postura]
  bloqueia: true
  stacks: ["*"]
  deteccao:
    tipo: comando
    cmd: npm ci --dry-run
  guia: checks/dependencias.md#dep-002

- id: DEP-003
  titulo: CVE critico ou alto sem correcao disponivel
